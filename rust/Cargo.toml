[workspace]
resolver = "2"
members = [
    "crates/unimanager-db",
    "crates/unimanager-ai",
    "crates/unimanager-core",
    "crates/unimanager-ui",
    "crates/unimanager-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bcrypt = "0.15"
jsonwebtoken = "9"
futures-util = "0.3"
pulldown-cmark = "0.12"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
dioxus = { version = "0.6", features = ["desktop"] }
